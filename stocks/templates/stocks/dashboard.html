{% extends 'stocks/base.html' %}
{% block content %}

<style>

/* ================================
   FULLSCREEN PREMIUM BACKGROUND
================================== */
.dashboard-bg {
    position: fixed;
    top: 80px; 
    left: 0;
    width: 100%;
    height: calc(100vh - 80px);
    background: url('https://cdn.mos.cms.futurecdn.net/nPtWzo4ktswYD4HUMQGj2Z.jpg')
                no-repeat center center/cover;
    display: flex;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
    overflow-y: auto;
}

.dashboard-bg::before {
    content: "";
    position: absolute;
    top: 80px;
    left: 0;
    width: 100%;
    height: calc(100vh - 80px);
    backdrop-filter: blur(10px);
    background: rgba(0, 0, 0, 0.65);
    z-index: 0;
}

/* ================================
   CENTER WRAPPER
================================== */
.dashboard-wrapper {
    position: relative;
    z-index: 2;
    width: 650px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    align-items: center;
}

/* ================================
   GLASS CARD STYLE
================================== */
.glass-card {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 26px;
    color: #fff;
    box-shadow: 0 15px 35px rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(15px);
}

.h2 {
    margin: 0 0 16px 0;
    font-size: 24px;
    font-weight: 700;
    color: #d9ecff;
}

/* ================================
   WATCHLIST
================================== */

.watchlist {
    display: flex;
    flex-direction: column;
}

.add-row {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
}

.add-row input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
}

.add-btn {
    background: linear-gradient(135deg, #ff5f73, #ff335c);
    border: none;
    padding: 12px 20px;
    border-radius: 18px;
    font-weight: 700;
    color: white;
    cursor: pointer;
}

.watch-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.10);
}

.ticker-link {
    color: #80c3ff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
}

.action-btn {
    background: rgba(255,255,255,0.10);
    padding: 8px 12px;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    margin-left: 6px;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.12);
}

/* ================================
   QUOTES SECTION
================================== */

.quote-box {
    font-size: 16px;
    color: #e7f4ff;
    text-align: center;
    line-height: 1.6;
    padding: 8px 6px;
    font-weight: 400;
    min-height: 60px;
    opacity: 0.9;
}

</style>


<div class="dashboard-bg">
  <div class="dashboard-wrapper">

    <!-- WATCHLIST GLASS CARD -->
    <div class="glass-card">
      <div class="h2">Your Watchlist</div>

      <form class="add-row" method="post" action="{% url 'add_ticker' %}">
        {% csrf_token %}
        <input type="text" name="ticker" placeholder="e.g. RELIANCE.NS" required>
        <button class="add-btn" type="submit">Add</button>
      </form>

      {% for s in stocks %}
      <div class="watch-row">
        <div>
          <a class="ticker-link" href="{% url 'ticker_detail' s.ticker %}">{{ s.ticker }}</a>
          <div style="font-size:11px; color:rgba(255,255,255,0.6);">· added</div>
        </div>

        <div>
          <a class="action-btn" href="{% url 'ticker_detail' s.ticker %}">View</a>
          <a class="action-btn" href="{% url 'remove_ticker' s.pk %}">Remove</a>
        </div>
      </div>
      {% empty %}
        <p style="color:#ccc;">No tickers in your watchlist.</p>
      {% endfor %}
    </div>

    <!-- ✨ QUOTES CARD (FINAL VERSION) -->
    <div class="glass-card">
      <div class="h2">Daily Market Wisdom</div>
      <div id="quote" class="quote-box"></div>
    </div>

  </div>
</div>


<!-- ================================
     JS: ROTATING QUOTES
================================== -->
<script>
const quotes = [
  "The stock market is a device for transferring money from the impatient to the patient. — Warren Buffett",
  "Trading is not about being right. It’s about making money. — Marty Schwartz",
  "In investing, what is comfortable is rarely profitable. — Robert Arnott",
  "Every champion was once a contender who refused to give up. — Rocky Balboa",
  "The best traders have no ego. You must swallow your pride and get out of a bad trade. — Paul Tudor Jones",
  "Success in markets requires discipline, not emotion. — Paul Tudor Jones",
  "Hope is not a strategy, but belief in your ability is. — Unknown",
  "The goal is not to predict the future, but to prepare for it. — Pericles",
  "Small steps every day lead to big changes over time. — Unknown",
  "Your future is created by what you do today, not tomorrow. — Anonymous"
];

function showQuote() {
  const box = document.getElementById("quote");
  const q = quotes[Math.floor(Math.random() * quotes.length)];
  box.innerHTML = q;
}

showQuote();
setInterval(showQuote, 8000);
</script>

{% endblock %}
