{% extends 'stocks/base.html' %}
{% block content %}

<style>

/* FULLSCREEN BACKGROUND STARTING BELOW NAVBAR */
.login-screen {
    position: fixed;
    top: 80px; /* matches navbar height */
    left: 0;
    width: 100%;
    height: calc(100vh - 80px);
    background: url("https://media.istockphoto.com/id/1916501163/photo/financial-data-for-trading-and-business-investment-stock-market-with-candlestick-on.webp?b=1&s=612x612&w=0&k=20&c=W7m9MhFsEYLeCid18Q_a_EK7k0XUeaCyX9NRa3A5lts=")
                no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* DARK GLASS OVERLAY */
.login-screen::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(5, 5, 5, 0.85);
    backdrop-filter: blur(8px);
}

/* LOGIN CARD */
.login-box {
    position: relative;
    z-index: 2;
    width: 420px;
    padding: 40px 35px;
    background: rgba(20, 20, 20, 0.45);
    border-radius: 18px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

/* TITLE */
.login-box h2 {
    font-size: 26px;
    color: #fff;
    margin-bottom: 20px;
}

/* LABELS */
.login-box label {
    width: 100%;
    text-align: left;
    display: block;
    margin: 10px 0 5px;
    color: #dcdcdc;
    font-size: 14px;
}

/* INPUTS */
.login-box input {
    width: 100%;
    padding: 12px 15px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255, 255, 255, 0.10);
    color: #fff;
    outline: none;
    font-size: 14px;
    margin-bottom: 18px;
}

.login-box input::placeholder {
    color: #cccccc;
}

/* PINK BUTTON */
.login-btn {
    width: 100%;
    padding: 12px;
    background: #ff5f73;
    border: none;
    border-radius: 25px;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.login-btn:hover {
    background: #ff3b54;
}

/* FOOTER LINK */
.login-links {
    margin-top: 15px;
    font-size: 14px;
    color: #ccc;
}

.login-links a {
    color: #ff8897;
    font-weight: 600;
    text-decoration: none;
    margin-left: 4px;
}

</style>

<!-- LOGIN BACKGROUND + BOX -->
<div class="login-screen">

    <div class="login-box">
        <h2>Login</h2>

        <form method="post">
            {% csrf_token %}

            <label>Username</label>
            <input name="username" placeholder="Enter username">

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password">

            <button type="submit" class="login-btn">GET STARTED</button>
        </form>

        <div class="login-links">
            Don't have an account?
            <a href="{% url 'signup' %}">Create Account</a>
        </div>
    </div>

</div>

{% endblock %}
